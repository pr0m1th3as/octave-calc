name: Install

# Builds the package once, since it is the same file on every platform, and
# installs it into LibreOffice on Linux, Windows and macOS, checking that
# every part of it was registered and what a formula calling Octave shows.
# The unit tests reach no LibreOffice at all, so only this catches a package
# that installs nowhere or a cell that cannot run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # unoidl-write, and the type libraries it compiles against
      - name: Install the LibreOffice SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-dev libreoffice-core

      - name: Build
        run: python3 tools/build_oxt.py

      - uses: actions/upload-artifact@v7
        with:
          name: oxt
          path: dist/*.oxt
          if-no-files-found: error

  install:
    name: Install on ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: oxt
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # python3-uno is the loader for the Python components; without it the
      # package cannot register
      - name: Install LibreOffice
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc-nogui python3-uno
          echo "UNOPKG=unopkg" >> "$GITHUB_ENV"

      # unopkg.com, since unopkg.exe writes nothing to the console
      - name: Install LibreOffice
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install libreoffice-fresh -y --no-progress
          echo "UNOPKG=C:/Program Files/LibreOffice/program/unopkg.com" \
            >> "$GITHUB_ENV"

      - name: Install LibreOffice
        if: runner.os == 'macOS'
        run: |
          brew install --cask libreoffice
          echo "UNOPKG=/Applications/LibreOffice.app/Contents/MacOS/unopkg" \
            >> "$GITHUB_ENV"

      - name: Install the package and check it
        shell: bash
        run: python tools/check_install.py "$UNOPKG" dist/*.oxt

  # The cell checks run =OCTAVE("plus";1;1) in LibreOffice without a window,
  # through the whole path a user's formula takes: the Add-In, finding
  # Octave, starting a devtools server and its sandbox.

  # The official Octave container is Ubuntu 26.04, whose LibreOffice is new
  # enough, and is given the namespaces the sandbox needs.  The check runs as
  # an ordinary user, as a user's own would: unopkg refuses to install for
  # root alone, and the sandbox then has no privilege to lean on, so the
  # runner must allow user namespaces to an unprivileged process.
  cell-linux:
    name: Cell on Linux, Octave 11.3.0
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: oxt
          path: dist

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install LibreOffice and devtools, and check the cell
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/work" --workdir /work --user root \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --cap-add SYS_ADMIN \
            ghcr.io/gnu-octave/octave:11.3.0 \
            bash -c 'set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                --no-install-recommends libreoffice-calc-nogui python3-uno \
                bubblewrap util-linux
              useradd --create-home calc
              as_calc="runuser -u calc -- env HOME=/home/calc"
              $as_calc octave-cli --norc --no-history \
                --eval "pkg install -forge devtools"
              $as_calc python3 tools/check_cell.py soffice unopkg dist/*.oxt'

  cell-macos:
    name: Cell on macOS, Octave from Homebrew
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: oxt
          path: dist

      - name: Install LibreOffice, Octave and devtools
        run: |
          set -euo pipefail
          brew install --cask libreoffice
          brew install octave
          octave-cli --norc --no-history \
            --eval "pkg ('install', '-forge', 'devtools')"

      # With the PATH a program started from the Dock has, so the cell must
      # find Homebrew's Octave by itself
      - name: Check the cell
        run: |
          app=/Applications/LibreOffice.app/Contents
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$app/Resources/python" tools/check_cell.py \
            "$app/MacOS/soffice" "$app/MacOS/unopkg" dist/*.oxt

  # Windows has no sandbox yet, so a cell must refuse to run
  cell-windows:
    name: Cell on Windows, no sandbox
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: oxt
          path: dist

      - name: Install Octave
        uses: pr0m1th3as/octave-ci/windows@v1

      - name: Install devtools
        shell: bash
        run: |
          octave-launch --no-gui --norc --silent --no-history \
            --eval "pkg ('install', '-forge', 'devtools')"

      - name: Install LibreOffice
        run: choco install libreoffice-fresh -y --no-progress

      - name: Check the cell
        shell: bash
        run: |
          program="C:/Program Files/LibreOffice/program"
          "$program/python.exe" tools/check_cell.py "$program/soffice.exe" \
            "$program/unopkg.com" dist/*.oxt --refusal
